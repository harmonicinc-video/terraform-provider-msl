name: build
on:
  push:
    branches:
      - main
      - "release/**"
  pull_request:
permissions:
  contents: read
jobs:
    test:
      runs-on: ubuntu-latest
      steps:
        - name: Checkout
          uses: actions/checkout@v4
        - name: Set up Go
          uses: actions/setup-go@v5
          with:
            go-version-file: 'go.mod'
        - name: Run linter
          run: make lint
        - name: Create build
          run: make build
        - name: Run tests
          run: make test
        - name: Set up Terraform
          uses: hashicorp/setup-terraform@v3
        - name: Run terraform fmt check
          run: make terraform-fmtcheck
