name: Auto-label pull request

on:
  pull_request:
    types:
      - opened
      - edited
      - reopened

permissions:
  pull-requests: write
  contents: read

jobs:
  label:
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/labeler@v5
        with:
          configuration-path: .github/labeler.yml
